services: 
  # --- Kafka ---
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  

  # --- Redis ---
  redis: 
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  # --- Email Server ---
  mailpit: 
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"


  # --- DBs ---
  # * Ticketing *
  postgres-ticketing:
    image: postgres:15
    environment: 
      POSTGRES_USER: group_7
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ticketing
    ports: 
      - "5432:5432"
    volumes:
      - ticketing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U group_7 -d ticketing"]
      interval: 10s       
      timeout: 5s         
      retries: 5                
      start_period: 10s  

  # * Management *
  postgres-management:
    image: postgres:15
    environment: 
      POSTGRES_USER: group_7
      POSTGRES_PASSWORD: root
      POSTGRES_DB: management
    ports: 
      - "5433:5432"
    volumes:
      - management_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U group_7 -d management"]
      interval: 10s       
      timeout: 5s         
      retries: 5                
      start_period: 10s  

  # * Identity *
  postgres-identity:
    image: postgres:15
    environment: 
      POSTGRES_USER: group_7
      POSTGRES_PASSWORD: root
      POSTGRES_DB: identity
    ports: 
      - "5434:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U group_7 -d identity"]
      interval: 10s       
      timeout: 5s         
      retries: 5                
      start_period: 10s  

  # * Payment *
  postgres-payment:
    image: postgres:15
    environment: 
      POSTGRES_USER: group_7
      POSTGRES_PASSWORD: root
      POSTGRES_DB: payment
    ports: 
      - "5435:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U group_7 -d payment"]
      interval: 10s       
      timeout: 5s         
      retries: 5                
      start_period: 10s  

  # * Catalog *
  mongo-catalog:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: group_7
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - catalog_data:/data/db
    healthcheck: 
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # --- Services ---
  # * Ticketing *
  ticketing-service:
    build: ./ticketing-service
    ports: 
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-ticketing:5432/ticketing
      - SPRING_DATASOURCE_USERNAME=group_7
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - QUEUE_BATCH_SIZE=3
      - QUEUE_INTERVAL_MS=10000
      - QUEUE_ADMISSION_TTL_SEC=1200
    depends_on:
      postgres-ticketing:
        condition: service_healthy

  # * Management *
  management-service:
    build: ./management-service
    ports: 
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-management:5432/management
      - SPRING_DATASOURCE_USERNAME=group_7
      - SPRING_DATASOURCE_PASSWORD=root
      - MIN_METRIC_AGE_MINUTES=20
    depends_on:
      postgres-management:
        condition: service_healthy

  # * Identity *
  identity-service:
    build: ./identity-service
    ports: 
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-identity:5432/identity
      - SPRING_DATASOURCE_USERNAME=group_7
      - SPRING_DATASOURCE_PASSWORD=root
      - JWT_SECRET=${JWT_SECRET:-FV/rcST35TJbxp6BVq9wOF59Fx5sfmUdR06/ykY/h58=}
    depends_on:
      postgres-identity:
        condition: service_healthy
      mailpit:
        condition: service_started

  # * Payment *
  payment-service:
    build: ./payment-service
    ports: 
      - "8084:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-payment:5432/payment
      - SPRING_DATASOURCE_USERNAME=group_7
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      postgres-payment:
        condition: service_healthy

  # * Catalog *
  catalog-service:
    build: ./catalog-service
    ports: 
      - "8085:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://group_7:root@mongo-catalog:27017/catalog?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mongo-catalog:
        condition: service_healthy

  # --- Gateway ---
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment: 
      - JWT_SECRET=${JWT_SECRET:-FV/rcST35TJbxp6BVq9wOF59Fx5sfmUdR06/ykY/h58=}


volumes:
  ticketing_data:
  catalog_data:
  management_data:
  identity_data:
  payment_data:
