spring:
  application:
    name: TicketYa
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: group_7
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  feign:
    catalog:
      url: http://catalog-service:8080
  config:
    reservation:
      max-tickets: 5
      max-ttl: 10
    queue:
      batch-size: ${QUEUE_BATCH_SIZE:2}
      batch-interval-ms: ${QUEUE_INTERVAL_MS:15000}
      admission-ttl-seconds: ${QUEUE_ADMISSION_TTL_SEC:600}
  url: http://ticketya.com/