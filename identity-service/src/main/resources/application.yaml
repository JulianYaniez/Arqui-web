spring:
  application:
    name: TicketYa
  datasource:
    url: jdbc:postgresql://localhost:5434/identity
    username: group_7
    password: root
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:14400000} # 4hs | Could implement shorter periods with refresh tokens; kept simple for time's sake.