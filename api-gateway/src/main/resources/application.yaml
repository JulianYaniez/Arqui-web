server:
  port: 8080

spring:
  application:
    name: API-Gateway
  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:
            - id: catalog-route
              uri: http://catalog-service:8080
              predicates:
                - Path=/api/catalog/**
              filters:
                - StripPrefix=2

            - id: ticketing-route
              uri: http://ticketing-service:8080
              predicates:
                - Path=/api/ticketing/**
              filters:
                - StripPrefix=2

            - id: management-route
              uri: http://management-service:8080
              predicates:
                - Path=/api/management/**
              filters:
                - StripPrefix=2

            - id: payment-route
              uri: http://payment-service:8080
              predicates:
                - Path=/api/payment/**
              filters:
                - StripPrefix=2

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 1. Catalog Service
        url: /api/catalog/v3/api-docs
      - name: 2. Ticketing Service
        url: /api/ticketing/v3/api-docs
      - name: 3. Management Service
        url: /api/management/v3/api-docs
      - name: 4. Payment Service
        url: /api/payment/v3/api-docs